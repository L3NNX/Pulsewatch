# PulseWatch Production Docker Compose
# Backend + PostgreSQL + Redis on VPS
# Frontend deployed separately on Vercel

services:
  postgres:
    image: postgres:16-alpine
    container_name: pw_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pulsewatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pulsewatch_secret}
      POSTGRES_DB: ${POSTGRES_DB:-pulsewatch}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulsewatch -d pulsewatch"]
      interval: 10s
      timeout: 5s
      retries: 5
    # RAM limit to prevent OOM on small VPS
    deploy:
      resources:
        limits:
          memory: 200M

  redis:
    image: redis:7-alpine
    container_name: pw_redis
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "50mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 64M

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pw_backend
    restart: always
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      LOG_LEVEL: info
      CORS_ORIGIN: ${FRONTEND_URL:-https://pulsewatch.vercel.app}
      DATABASE_URL: postgresql://pulsewatch:${POSTGRES_PASSWORD:-pulsewatch_secret}@postgres:5432/pulsewatch?schema=public
      DIRECT_URL: postgresql://pulsewatch:${POSTGRES_PASSWORD:-pulsewatch_secret}@postgres:5432/pulsewatch?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      RUN_WORKER_IN_API: "true"
    deploy:
      resources:
        limits:
          memory: 200M

volumes:
  pgdata:
  redisdata:
